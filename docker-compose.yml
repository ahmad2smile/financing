# Local dev stack. Dev-only passwords: never reuse them anywhere real.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Only for setup (docker/postgres/*.sql) and admin work. The app connects as "financing".
      POSTGRES_USER: superuser
      POSTGRES_PASSWORD: superuser
      POSTGRES_DB: financing
      # Read by docker/postgres/03-quotes.sql. Same value the app uses (lib/quote.ts).
      PRICE_PER_KW: ${NEXT_PUBLIC_PRICE_PER_KW:?Error! Set NEXT_PUBLIC_PRICE_PER_KW in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs only when the volume is empty. Reset with `docker compose down -v`.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superuser -d financing && pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      # Browsers reach Keycloak on localhost:8080, the app container on keycloak:8080. Tokens always name
      # localhost:8080 as issuer, and a call to keycloak:8080 gets token and key URLs on keycloak:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    # Back-channel logout calls the app on the host. Docker Desktop has this name already, Linux needs it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Imported on start only if the realm does not exist yet
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl, so talk HTTP to the management port with bash
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 40

  # The app as a production build (Dockerfile). Only with: docker compose --profile app up -d --build
  # It takes port 3000 like `pnpm dev`, so run one or the other.
  app:
    profiles: [app]
    build:
      context: .
      args:
        NEXT_PUBLIC_PRICE_PER_KW: ${NEXT_PUBLIC_PRICE_PER_KW:?Error! Set NEXT_PUBLIC_PRICE_PER_KW in .env}
    env_file: .env
    environment:
      # Inside the compose network Postgres is "postgres", not localhost
      DATABASE_URL: postgres://financing:financing@postgres:5432/financing
      # Browsers still use KEYCLOAK_ISSUER (localhost:8080), the server calls Keycloak here
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/financing
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres-data:
