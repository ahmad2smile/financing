# Local dev stack. Dev-only passwords: never reuse them anywhere real.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Only for setup (docker/postgres/*.sql) and admin work. The app connects as "financing".
      POSTGRES_USER: superuser
      POSTGRES_PASSWORD: superuser
      POSTGRES_DB: financing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs only when the volume is empty. Reset with `docker compose down -v`.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superuser -d financing && pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    # Back-channel logout calls the app on the host. Docker Desktop has this name already, Linux needs it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Imported on start only if the realm does not exist yet
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl, so talk HTTP to the management port with bash
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  postgres-data:
